<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#2C1711;--gold:#C29A54;--cream:#F3D275;--choc:#7B4003;--s:1.66}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;color:var(--cream)}
body::before{content:"";position:absolute;inset:0;background:url(tile.webp) 0 0/340px auto repeat;opacity:.06}
body::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 45% at 50% 55%,rgba(194,154,84,.22),transparent 70%)}
.cap{position:absolute;top:70px;left:0;right:0;text-align:center;z-index:5;height:230px}
.cap .step{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:14px;opacity:0;transform:translateY(24px);transition:opacity .45s ease,transform .55s cubic-bezier(.2,.9,.3,1.2)}
.cap .step.on{opacity:1;transform:none}
.num{width:88px;height:88px;border-radius:50%;background:var(--cream);color:var(--bg);display:grid;place-items:center;font-size:50px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.t{font-size:66px;font-weight:700;line-height:1.15}
.sub{font-size:36px;color:#e9d9b8;opacity:.9}
.phone{position:absolute;left:50%;top:330px;transform:translateX(-50%);padding:18px;border-radius:92px;background:linear-gradient(145deg,#2a2a2e,#0d0d0f);box-shadow:0 0 0 3px #3a3a40,0 40px 90px rgba(0,0,0,.6);z-index:2;transition:transform .9s cubic-bezier(.6,0,.2,1),opacity .6s}
.screen{position:relative;width:calc(390px*var(--s));height:calc(844px*var(--s));border-radius:76px;overflow:hidden;background:#000}
.screen iframe{position:absolute;left:0;top:0;width:390px;height:844px;border:0;transform:scale(var(--s));transform-origin:0 0;display:block}
.island{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:190px;height:54px;border-radius:30px;background:#000;z-index:3}
.tap{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:rgba(243,210,117,.35);border:5px solid rgba(255,255,255,.9);z-index:6;opacity:0;transform:scale(.6);transition:left .55s cubic-bezier(.4,0,.2,1),top .55s cubic-bezier(.4,0,.2,1),opacity .25s,transform .25s;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.tap.on{opacity:1;transform:scale(1)}
.tap.press{transform:scale(.72);background:rgba(243,210,117,.6)}
.foot{position:absolute;bottom:40px;left:0;right:0;text-align:center;z-index:4;font-size:30px;color:var(--gold);letter-spacing:.5px;transition:opacity .5s}
.outro{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;opacity:0;pointer-events:none;transition:opacity .7s;background:radial-gradient(70% 50% at 50% 50%,rgba(44,23,17,.55),rgba(44,23,17,.97))}
.outro.on{opacity:1}
.outro img{width:620px;transform:scale(.9);transition:transform 1.2s cubic-bezier(.2,.9,.3,1.1)}
.outro.on img{transform:none}
.outro .o1{font-size:72px;font-weight:700}
.outro .o2{font-size:40px;color:#eadbb9}
.pill{display:flex;align-items:center;gap:18px;padding:22px 44px;border-radius:999px;background:#25D366;color:#fff;font-size:46px;font-weight:700;direction:ltr;box-shadow:0 14px 40px rgba(0,0,0,.4)}
.pill svg{width:54px;height:54px}
</style></head><body>
<div class="cap">
  <div class="step" id="c0"><div class="t">منيو سينوفا الإلكتروني</div><div class="sub">اطلب حلوياتك من جوالك بخطوات بسيطة</div></div>
  <div class="step" id="c1"><div class="num">١</div><div class="t">اختر القسم</div></div>
  <div class="step" id="c2"><div class="num">٢</div><div class="t">أضف الأصناف إلى السلة</div></div>
  <div class="step" id="c3"><div class="num">٣</div><div class="t">أكمل بيانات الحجز</div></div>
  <div class="step" id="c4"><div class="num">٤</div><div class="t">أرسل طلبك عبر واتساب</div></div>
</div>
<div class="phone" id="phone"><div class="screen" id="screen"><div class="island"></div><iframe id="f" src="menu/index.html"></iframe></div></div>
<div class="tap" id="tap"></div>
<div class="foot" id="foot">دير البلح · شرق دوار البركة</div>
<div class="outro" id="outro"><img src="logo_word.svg" alt=""><div class="o1">اطلب الآن من سينوفا</div><div class="o2">توصيل أو استلام من المحل · دير البلح</div>
<div class="pill"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.2A9.7 9.7 0 0 0 3.6 16.8L2.3 21.7l5-1.3A9.7 9.7 0 1 0 12 2.2zm0 17.7a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 19.9zm4.4-6c-.2-.1-1.4-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.6 6.6 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3a.4.4 0 0 0 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>059 487 0202</div></div>
<script>
const S=1.66, $=s=>document.querySelector(s), sleep=ms=>new Promise(r=>setTimeout(r,ms));
const F=()=>$('#f').contentWindow, D=()=>$('#f').contentDocument;
function cap(i){ document.querySelectorAll('.step').forEach((e,k)=>e.classList.toggle('on',k===i)); }
function pos(el){ const r=el.getBoundingClientRect(), s=$('#screen').getBoundingClientRect(); return [s.left+(r.left+r.width/2)*S, s.top+(r.top+r.height/2)*S]; }
async function moveTo(el){ const [x,y]=pos(el), t=$('#tap'); t.style.left=x+'px'; t.style.top=y+'px'; t.classList.add('on'); await sleep(560); }
async function tap(sel,{hold=180}={}){ const el=typeof sel==='string'?D().querySelector(sel):sel; if(!el) throw new Error('missing '+sel); await moveTo(el); const t=$('#tap'); t.classList.add('press'); await sleep(hold); el.click(); t.classList.remove('press'); await sleep(120); }
function hideTap(){ $('#tap').classList.remove('on'); }
async function scrollTo(y,ms=600){ const w=F(), y0=w.scrollY, t0=performance.now(); return new Promise(res=>{ (function step(){ const p=Math.min(1,(performance.now()-t0)/ms), e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2; w.scrollTo(0,y0+(y-y0)*e); p<1?requestAnimationFrame(step):res(); })(); }); }
async function typeInto(sel,text,dt=70){ const el=D().querySelector(sel); for(const ch of text){ el.value+=ch; el.dispatchEvent(new Event('input',{bubbles:true})); await sleep(dt); } }
async function run(){
  await document.fonts.ready; await new Promise(r=>{ const f=$('#f'); if(f.contentDocument&&f.contentDocument.readyState==='complete') r(); else f.onload=r; });
  F().openWA=()=>{};                       // ما بنفتح واتساب فعلياً بالفيديو
  window.__start=Date.now(); const T=t=>sleep(Math.max(0,t-(Date.now()-window.__start)));
  cap(0);
  await T(2700); cap(1);
  await T(3300); await tap('.cats [data-c="sharqi"]');
  await T(4700); cap(2);
  await scrollTo(260,700);
  await T(5600); await tap('#view-cat [data-card="s4"] [data-a="add"]');
  await T(6500); await tap('#view-cat [data-card="s4"] [data-a="inc"]',{hold:140});
  await T(7300); cap(3);
  await T(7500); await tap('#cartbar button');
  await T(8600); await tap('#sheet [data-a="pane"][data-p="checkout"]');
  await T(9300); await moveTo(D().querySelector('#i-name')); await typeInto('#i-name','أحمد',90);
  await tap('[data-a="mode"][data-m="pickup"]',{hold:120});
  { const d=new Date(Date.now()+26*3600e3); d.setHours(17,0,0,0); D().querySelector('#i-time').value=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16); }
  await T(11000); cap(4);
  await T(11300); await tap('#sheet [data-a="send"]');
  await T(12300); hideTap();
  await T(13000); cap(-1); $('#foot').style.opacity=0; $('#phone').style.transform='translateX(-50%) scale(.82)'; $('#phone').style.opacity='.0'; $('#outro').classList.add('on');
  await T(15000); window.__done=true;
}
run().catch(e=>{ window.__err=String(e); window.__done=true; });
</script></body></html>
