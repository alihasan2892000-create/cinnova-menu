<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:P;font-weight:400;src:url(plex400.ttf)}@font-face{font-family:P;font-weight:500;src:url(plex500.ttf)}
@font-face{font-family:P;font-weight:600;src:url(plex600.ttf)}@font-face{font-family:P;font-weight:700;src:url(plex700.ttf)}
:root{--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.45,.5,1)}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:clip;background:#2C1711;font-family:P,sans-serif;color:#F3D275}
.deco{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:-200px;background:url(tile.webp) 0 0/360px auto repeat;opacity:.07;animation:drift 8s linear infinite}
@keyframes drift{to{transform:translate(120px,-180px)}}
.glow{position:absolute;inset:0;background:radial-gradient(48% 26% at 50% 38%,rgba(194,154,84,.38),transparent 70%);opacity:0;animation:fade 1.2s var(--ease) .2s forwards}
.rays{position:absolute;left:50%;top:730px;width:1500px;height:1500px;margin:-750px 0 0 -750px;background:repeating-conic-gradient(rgba(243,210,117,.07) 0 6deg,transparent 6deg 18deg);border-radius:50%;mask-image:radial-gradient(closest-side,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(closest-side,#000 30%,transparent 75%);opacity:0;animation:fade 1.4s var(--ease) .3s forwards,spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{to{opacity:1}}
.frame{position:absolute;inset:30px;border:2px solid rgba(194,154,84,.3);border-radius:48px;opacity:0;animation:fade 1s ease .1s forwards}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center}
.badge{margin-top:470px;width:520px;height:520px;position:relative}
.badge img{width:100%;height:100%;opacity:0;transform:scale(.4) rotate(-25deg);animation:pop 1.1s var(--spring) .35s forwards;filter:drop-shadow(0 30px 60px rgba(0,0,0,.55))}
@keyframes pop{to{opacity:1;transform:none}}
.ring{position:absolute;inset:-26px;border-radius:50%;border:3px solid rgba(243,210,117,.55);opacity:0;transform:scale(.6);animation:ring 1.4s var(--ease) .55s forwards}
@keyframes ring{40%{opacity:1}to{opacity:0;transform:scale(1.35)}}
.k{margin-top:70px;font-size:50px;font-weight:500;color:#E9D9B8;opacity:0;transform:translateY(30px);animation:up .8s var(--ease) 1.25s forwards}
.t{margin-top:2px;padding:0 10px 18px;font-size:100px;font-weight:700;line-height:1.25;background:linear-gradient(100deg,#C29A54 0%,#F7DE8C 40%,#FFF6D6 50%,#F7DE8C 60%,#C29A54 100%);background-size:250% 100%;background-position:100% 0;-webkit-background-clip:text;color:transparent;opacity:0;transform:translateY(30px);animation:up .8s var(--ease) 1.45s forwards,shine 1.6s ease-in-out 2.4s forwards}
@keyframes up{to{opacity:1;transform:none}}
@keyframes shine{to{background-position:0 0}}
.sub{margin-top:20px;font-size:36px;color:#D9C7A3;opacity:0;transform:translateY(30px);animation:up .8s var(--ease) 1.75s forwards}
.row{margin-top:56px;display:flex;align-items:center;gap:34px;opacity:0;transform:translateY(40px);animation:up .9s var(--ease) 2.05s forwards}
.qr{width:290px;padding:18px;border-radius:30px;background:#FFF8EC;box-shadow:0 0 0 8px rgba(194,154,84,.3),0 24px 60px rgba(0,0,0,.5)}
.qr img{display:block;width:100%;border-radius:12px}
.info{display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.info .a{font-size:38px;font-weight:700;color:#F3D275}
.info .b{font-size:30px;color:#D9C7A3;line-height:1.4}
.link{margin-top:90px;display:flex;align-items:center;gap:16px;padding:24px 50px;border-radius:999px;background:#F3D275;color:#2C1711;font-size:46px;font-weight:700;box-shadow:0 16px 40px rgba(0,0,0,.45);opacity:0;transform:scale(.85);animation:pop2 .8s var(--spring) 2.3s forwards}
@keyframes pop2{to{opacity:1;transform:none}}
.link svg{width:46px;height:46px;animation:bob 1s ease-in-out 3.2s infinite alternate}
@keyframes bob{to{transform:translateY(-10px)}}
.addr{position:absolute;bottom:250px;left:0;right:0;text-align:center;font-size:30px;color:#C29A54;opacity:0;animation:fade 1s ease 2.9s forwards}
</style></head><body>
<div id="root" style="display:none"><div class="deco"><div class="bg"></div><div class="glow"></div><div class="rays"></div></div><div class="frame"></div>
<div class="wrap">
  <div class="badge"><div class="ring"></div><img src="badge.png" alt=""></div>
  <div class="k">اطلب الآن من</div>
  <div class="t">المنيو الإلكتروني</div>
  <div class="sub">تصفّح الأصناف والأسعار، وأرسل طلبك عبر واتساب</div>
  <div class="link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>رابط المنيو في البايو</div>
</div>
<div class="addr">دير البلح · شرق دوار البركة</div></div>
<script>
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
window.__ev=[];
window.__vsync=()=>{ const t=performance.now(); for(const a of document.getAnimations()){ if(a.__t0===undefined){ a.__t0=t; a.pause(); } const ct=Math.max(0,t-a.__t0), end=a.effect&&a.effect.getComputedTiming().endTime; if(isFinite(end)&&ct>=end) a.finish(); else a.currentTime=ct; } };
// الأنيميشن بتبلّش بس لما يجي __go (عشان التسجيل يبلّش من أول لقطة)
(async()=>{ await document.fonts.ready; window.__ready=true; while(!window.__go) await sleep(20);
  document.getElementById('root').style.display='block';   // الأنيميشن بتنخلق هون، أول لقطة
  window.__start=Date.now(); window.__ev=[["whoosh",250],["impact",550],["pop",2300],["success",2700]];
  await sleep(5500); window.__done=true; })();
</script></body></html>
